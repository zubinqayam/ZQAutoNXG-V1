#
# Default values for ZQAutoNXG.
# Secrets are intentionally empty and must be supplied by deployment tooling
# when the corresponding optional service is enabled.

replicaCount: 2

image:
  repository: zqautonxg
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.zqautonxg.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: false
  storageClass: "standard"
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /app/data

postgres:
  enabled: false
  image: postgres:15-alpine
  port: 5432
  database: zqautonxg
  username: zquser
  password: ""
  persistence:
    enabled: false
    size: 5Gi
    storageClass: standard
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  enabled: false
  image: redis:7-alpine
  port: 6379
  password: ""
  persistence:
    enabled: false
    size: 2Gi
    storageClass: standard
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

prometheus:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  image: prom/prometheus:v2.48.1
  persistence:
    enabled: false
    size: 5Gi
    storageClass: standard
  retention: 15d
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

grafana:
  enabled: false
  adminPassword: ""
  image:
    repository: grafana/grafana
    tag: "10.2.3"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

otel:
  enabled: false
  endpoint: "http://otel-collector:4317"
  serviceName: "zqautonxg"
  collector:
    enabled: false
    image:
      repository: otel/opentelemetry-collector-contrib
      pullPolicy: IfNotPresent
      tag: "0.91.0"
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

multiTenant:
  enabled: false
  isolation: namespace
  tenants: []

env:
  - name: ZQ_MODE
    value: "production"
  - name: ZQ_METRICS_ENABLED
    value: "true"
  - name: INNM_OPAQUE_CONTEXT
    value: "true"
  - name: ZQ_SAFE_EXECUTION
    value: "true"

nodeSelector: {}
tolerations: []
affinity: {}
