# Default values for ZQAutoNXG
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: zqautonxg
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.zqautonxg.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: zqautonxg-tls
  #    hosts:
  #      - api.zqautonxg.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: false
  storageClass: "standard"
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /app/data

# PostgreSQL configuration
postgres:
  enabled: false
  image: postgres:15-alpine
  port: 5432
  database: zqautonxg
  username: zquser
  password: zqpass
  persistence:
    enabled: false
    size: 5Gi
    storageClass: standard

# Redis configuration
redis:
  enabled: false
  image: redis:7-alpine
  port: 6379
  password: ""
  persistence:
    enabled: false
    size: 2Gi
    storageClass: standard

# Prometheus configuration
prometheus:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

# Grafana configuration
grafana:
  enabled: false
  adminPassword: zqadmin

# OpenTelemetry configuration
otel:
  enabled: false
  endpoint: "http://otel-collector:4317"
  serviceName: "zqautonxg"
  collector:
    enabled: false

# Multi-tenant configuration
multiTenant:
  enabled: false
  isolation: namespace
  tenants: []

# Environment variables
env:
  - name: ZQ_MODE
    value: "production"
  - name: ZQ_METRICS_ENABLED
    value: "true"
  - name: INNM_OPAQUE_CONTEXT
    value: "true"
  - name: ZQ_SAFE_EXECUTION
    value: "true"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
