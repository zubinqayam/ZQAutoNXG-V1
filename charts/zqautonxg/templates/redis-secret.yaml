{{- if and .Values.redis.enabled .Values.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zqautonxg.fullname" . }}-redis
  labels:
    {{- include "zqautonxg.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
type: Opaque
data:
  password: {{ .Values.redis.password | b64enc }}
{{- end }}
