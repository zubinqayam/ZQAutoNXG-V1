name: Frontend Dependency Refresh

on:
  push:
    branches: ["stabilize/full-program-readiness"]
    paths:
      - ".github/workflows/frontend-dependency-refresh.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: write

concurrency:
  group: frontend-dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/full-program-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade vulnerable Vite toolchain
        working-directory: frontend
        run: |
          npm install --save-dev vite@^8.2.2 @vitejs/plugin-react@^6.1.0
          npm audit fix
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Commit resolved manifests
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Dependency manifests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "security: upgrade Vite toolchain to patched releases"
          git push origin HEAD:stabilize/full-program-readiness
