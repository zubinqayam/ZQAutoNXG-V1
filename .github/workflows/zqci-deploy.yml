          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Ready for deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**ZCD Compliant:** Yes" >> $GITHUB_STEP_SUMMARY
