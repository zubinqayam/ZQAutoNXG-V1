  deploy-production:
    needs: [build, helm-lint, deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.zqautonxg.enterprise.local
    steps:
      - name: Checkout
