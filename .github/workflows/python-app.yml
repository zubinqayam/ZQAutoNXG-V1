name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==7.1.1 pytest==8.3.4 pyyaml==6.0.3
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Validate Python sources
        run: |
          python -m compileall -q zqautonxg tests .github/scripts
          flake8 zqautonxg tests .github/scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag zqautonxg:ci .
      - name: Smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name zqautonxg-ci --publish 8000:8000 zqautonxg:ci
          trap 'docker logs zqautonxg-ci; docker rm --force zqautonxg-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Application did not become healthy"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/ui >/dev/null

