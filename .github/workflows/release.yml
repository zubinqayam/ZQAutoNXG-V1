name: ZQAutoNXG Release & CI/CD

on:
  push:
    branches: ["main", "master"]
    tags: ["v*", "gv*", "*-release"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality & Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8.4,<10" flake8==7.1.1 bandit ruff

      - name: Validate Python sources
        run: |
          python -m compileall -q zqautonxg tests
          flake8 zqautonxg tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: python -m pytest -q

      - name: Security scan
        run: bandit -q -r zqautonxg -f json -o bandit-report.json || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend build
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/package-lock.json && -f frontend/package.json ]]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.buildable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.detect.outputs.buildable == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Static frontend validation
        if: steps.detect.outputs.buildable != 'true'
        run: test -f frontend/index.html

  container:
    name: Production Container Smoke Test
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag zqautonxg:ci .

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name zqautonxg-release-ci --publish 8000:8000 zqautonxg:ci
          trap 'docker logs zqautonxg-release-ci || true; docker rm --force zqautonxg-release-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Application did not become healthy"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null
          curl --fail --silent http://127.0.0.1:8000/version >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/workflows >/dev/null
          curl --fail --silent http://127.0.0.1:8000/ui >/dev/null

  publish-image:
    name: Publish GHCR Image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: container
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release UI
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Package source release
        shell: bash
        run: |
          set -euo pipefail
          package="zqautonxg-${GITHUB_REF_NAME}"
          mkdir -p "release/${package}"
          cp -r zqautonxg frontend docs "release/${package}/"
          cp requirements.txt pyproject.toml Dockerfile README.md LICENSE "release/${package}/"
          test -f "release/${package}/frontend/dist/index.html"
          tar -C release -czf "release/${package}.tar.gz" "${package}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/zqautonxg-${{ github.ref_name }}.tar.gz
