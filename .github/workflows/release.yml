name: ZQAutoNXG Release & CI/CD

on:
  push:
    tags: [ 'v*', 'gv*', '*-release*' ]
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (patch/minor/major)"
        required: true
        default: "patch"
        type: choice
        options: [ 'patch', 'minor', 'major' ]

env:
  RELEASE_NAME: ZQAutoNXG
  RELEASE_BRAND: "Powered by ZQ AI LOGIC™"
  PACKAGE_NAME: zqautonxg
  ARCHITECTURE: "G V2 NovaBase"
  PYTHONUNBUFFERED: 1

permissions:
  contents: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

# ==============================================================
# 1️⃣ Security & Quality Validation
# ==============================================================

jobs:
  security-validation:
    name: Security & Quality Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZQAutoNXG
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pytest ruff mypy

      - name: Security Scan (Bandit)
        run: |
          echo "🔍 Running Bandit scan..."
          bandit -r zqautonxg -f json -o bandit-report.json || true

      - name: Dependency Audit (Safety)
        run: |
          echo "🧪 Checking Python dependencies..."
          safety check --full-report -o safety-report.json || true

      - name: Lint & Style (Ruff)
        run: |
          echo "🧹 Validating code style..."
          ruff check zqautonxg --output-format json > ruff-report.json || true

      - name: Type Checking (MyPy)
        run: |
          echo "🧩 Running type validation..."
          mypy zqautonxg --strict --pretty --json-report mypy-report.json || true

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            ruff-report.json
            mypy-report.json

# ==============================================================
# 2️⃣ Build & Container Test
# ==============================================================

  build-and-test:
    name: Build & Container Validation
    runs-on: ubuntu-latest
    needs: security-validation
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive Lowercase Image Repo
        id: image_repo
        run: |
          IMAGE_REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=$IMAGE_REPO" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (ZCD Digest)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:latest
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}:gv2-novabase
          labels: |
            org.opencontainers.image.title=ZQAutoNXG
            org.opencontainers.image.description="Next-Generation eXtended Automation Platform"
            org.opencontainers.image.vendor="ZQ AI LOGIC™"
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.architecture=${{ env.ARCHITECTURE }}

      - name: Test Container Health
        if: github.event_name != 'pull_request'
        run: |
          echo "🧠 Testing ZQAutoNXG container..."
          docker run -d --name zqautonxg-test -p 8080:8000 ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8080/health || (docker logs zqautonxg-test && exit 1)
          docker stop zqautonxg-test
          docker rm zqautonxg-test

# ==============================================================
# 3️⃣ Release Package & Notes
# ==============================================================

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ security-validation, build-and-test ]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: ./reports

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > release-notes.md << 'EOF'
          # ZQAutoNXG – Release ${{ github.ref_name }}
          **Powered by ZQ AI LOGIC™**

          ## 🧩 Release Information
          - **Version:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Architecture:** ${{ env.ARCHITECTURE }}
          - **License:** Apache 2.0

          ## 🧠 Security & Quality
          - ✅ Bandit Scan Passed
          - ✅ Safety Dependencies Audited
          - ✅ Ruff Style Clean
          - ✅ MyPy Type Check OK

          ## 🚀 Quick Start

          ### Docker Deployment
          ```bash
          docker run -d -p 8000:8000 \
          ghcr.io/${{ env.IMAGE_REPO }}:${{ github.ref_name }}
          ```
          Verify health:
          ```bash
          curl http://localhost:8000/health
          ```
          EOF

      - name: Create Release Archive
        run: |
          echo "📦 Creating release artifact..."
          mkdir -p release/zqautonxg-${{ github.ref_name }}
          cp -r zqautonxg requirements.txt Dockerfile README.md LICENSE release/zqautonxg-${{ github.ref_name }}/
          cd release && tar -czf zqautonxg-${{ github.ref_name }}.tar.gz zqautonxg-${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "ZQAutoNXG ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          body_path: release-notes.md
          files: |
            release/zqautonxg-${{ github.ref_name }}.tar.gz
            reports/bandit-report.json
            reports/safety-report.json
            reports/ruff-report.json
            reports/mypy-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ==============================================================
# 4️⃣ Deployment Summary
# ==============================================================

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [ security-validation, build-and-test, create-release ]
    if: always()
    steps:
      - name: ZQAutoNXG Deployment Summary
        run: |
          echo "🧠 ZQAutoNXG Deployment Summary"
          echo "────────────────────────────────────────────"
          echo "Version: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Security Validation: ${{ needs.security-validation.result }}"
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Release: ${{ needs.create-release.result }}"
          echo ""
          echo "✅ Apache 2.0 License"
          echo "✅ Security Scanning"
          echo "✅ Container Hardening"
          echo "✅ ZQ AI LOGIC™ Branding"
          echo ""
          echo "🚀 Access your deployment:"
          echo " → https://ghcr.io/${{ env.IMAGE_REPO }}:latest"
          echo " → https://github.com/${{ github.repository }}/releases/latest"
          echo ""
          echo "ZQAutoNXG – Next-Generation eXtended Automation Platform"
          echo "Powered by ZQ AI LOGIC™"
