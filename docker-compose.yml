services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zqautonxg-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ZQAutoNXG
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql://zqadmin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/zqautonxg
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:1420
      LOG_LEVEL: INFO
      CONTAINER_RUNTIME: docker-compose
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zqautonxg-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: zqautonxg-postgres
    environment:
      POSTGRES_DB: zqautonxg
      POSTGRES_USER: zqadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zqadmin -d zqautonxg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zqautonxg-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zqautonxg-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zqautonxg-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: zqautonxg-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - zqautonxg-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: zqautonxg-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - zqautonxg-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  zqautonxg-network:
    driver: bridge
    name: zqautonxg-network
